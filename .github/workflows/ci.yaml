name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TRIVY: aquasec/trivy:0.76.2
  GITLEAKS: zricethezav/gitleaks:v8.30.1
  SYFT: anchore/syft:v1.57.2

jobs:
  library-tests:
    name: Shared library tests (JenkinsPipelineUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test

  pipeline-smoke:
    name: Same pipeline on GitHub Actions (sample-app)
    runs-on: ubuntu-latest
    needs: library-tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Secret scan (gitleaks, full history)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS" git --redact --no-banner --exit-code 0 \
            --config resources/io/github/pratheek888/devsecops/gitleaks.toml \
            --report-format json --report-path reports/gitleaks.json .
      - name: Build & unit test
        run: mvn -B -f sample-app/pom.xml verify
      - name: SCA + IaC scan (trivy fs)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY" fs --quiet --scanners vuln,misconfig \
            --format json --output reports/trivy-fs.json --exit-code 0 sample-app
      - name: Build image (no push)
        run: |
          docker build -t hello-service:${GITHUB_SHA::8} sample-app
          docker save hello-service:${GITHUB_SHA::8} -o image.tar
      - name: Image scan + SBOM
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY" image --quiet --input image.tar \
            --scanners vuln,secret --format json --output reports/trivy-image.json --exit-code 0
          docker run --rm -v "$PWD:/work" -w /work "$SYFT" scan docker-archive:image.tar \
            --output cyclonedx-json=reports/sbom.cdx.json --quiet
      - name: Security gate (same policy engine as Jenkins)
        run: |
          ./gradlew -q --no-daemon securityGate --args="--env dev --policy sample-app/.security-policy.yaml \
            --trivy dependencies=reports/trivy-fs.json --trivy image=reports/trivy-image.json \
            --gitleaks reports/gitleaks.json --out reports"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: reports/

  gitops-script:
    name: GitOps promote script (shellcheck + integration test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck resources/io/github/pratheek888/devsecops/gitops-promote.sh test/gitops-promote-test.sh
      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - run: sh test/gitops-promote-test.sh

  tools-image:
    name: Agent tools image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build (verifies every pinned tool runs)
        run: docker build -t ghcr.io/${{ github.repository_owner }}/devsecops-tools:latest tools
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-tools:latest
