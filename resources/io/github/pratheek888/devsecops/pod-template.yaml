# Kubernetes agent for the pipeline. ${...} placeholders are filled in by devsecopsPipeline.
apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins/agent: devsecops
spec:
  serviceAccountName: ${serviceAccount}
  securityContext:
    fsGroup: 1000
  containers:
    - name: build
      image: ${buildImage}
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests: { cpu: "1", memory: 2Gi }
        limits: { memory: 4Gi }
    - name: tools
      # gitleaks, trivy, syft, cosign, crane, yq, jq (see tools/Dockerfile)
      image: ${toolsImage}
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits: { memory: 3Gi }
    - name: kaniko
      # Daemonless, rootless-friendly image builds: no Docker socket on the agent.
      image: gcr.io/kaniko-project/executor:debug
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests: { cpu: "1", memory: 2Gi }
        limits: { memory: 4Gi }
